# Dagens klipp för TikTok och Instagram: spelar in /klipp (gårdagens bästa klippfråga) som en
# 15–30 sekunder lång MP4 i 1080×1920 och lägger den med en färdig bildtext som en release på GitHub.
# Startas för hand under Actions → Dagens klipp → Run workflow. Den dagliga körningen är pausad;
# lägg tillbaka "schedule: - cron: \"17 6 * * *\"" under on: för att slå på den igen.
name: Dagens klipp

on:
  workflow_dispatch:
    inputs:
      dag:
        description: "Dag att göra klipp av (ÅÅÅÅ-MM-DD). Tomt = igår."
        required: false
      id:
        description: "Eller en viss fråga (id) som redan spelats. Tomt = dagens urval."
        required: false
      serie:
        description: "Eller en serie med tre frågor (blagult, vm). Tomt = en fråga."
        required: false

permissions:
  contents: write

jobs:
  klipp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera Playwright och ffmpeg
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Spela in klippet
        env:
          KLIPP_URL: https://straffpunkten.vercel.app/klipp
          KLIPP_DAG: ${{ github.event.inputs.dag }}
          KLIPP_ID: ${{ github.event.inputs.id }}
          KLIPP_SERIE: ${{ github.event.inputs.serie }}
          KLIPP_UT: klipp
        run: node scripts/klipp.mjs
      - name: Publicera som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$KLIPP_NAMN" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$KLIPP_NAMN" "klipp/$KLIPP_NAMN.mp4" "klipp/$KLIPP_NAMN.txt" \
            --title "Klipp $KLIPP_NAMN" --notes-file "klipp/$KLIPP_NAMN.txt"
