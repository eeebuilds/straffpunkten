<style>
/* Samma kvällsmatch som Dagens straffpunkt: mörk plan, kritvita linjer, gult accentljus. Frågan ligger på ett ljust kort. */
:root {
  --night: #06120D; --card: #0F241A; --card-line: #1C3A2A; --dim: #14301F;
  --chalk: #F3F5EF; --muted: #9FB8A8; --soft: #C9D6CD; --line: #2A4A38;
  --accent: #FFD23F; --accent-deep: #B8901A; --good: #4BE08A; --bad: #FF6B57;
  --paper: #F3F5EF; --paper-ink: #0B1A12; --paper-muted: #4E6356; --paper-line: #D3DCD5;
  --right: #1F8A4C; --right-bg: #E2F4E8; --wrong: #C8372B; --wrong-bg: #FBE4E0;
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  margin: 0; background: var(--night); color: var(--chalk); font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Sidhuvud */
.topbar { height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--chalk); text-decoration: none; }
.brand b { font-weight: 800; font-stretch: 125%; font-size: 1rem; letter-spacing: .01em; text-transform: uppercase; }
.back { font-weight: 600; font-size: .9rem; color: var(--accent); text-underline-offset: 4px; white-space: nowrap; }
header { display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-weight: 800; font-stretch: 125%; font-size: clamp(1.8rem, 8vw, 2.3rem); line-height: 1.02; letter-spacing: -.015em; }
h1 a { color: inherit; text-decoration: none; }
.modes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--card); border-radius: 14px; }
.mode { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--soft); font: 700 1rem var(--font); cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--chalk); color: var(--paper-ink); }

/* Resultattavla */
.board { background: var(--card); border: 1px solid var(--card-line); border-radius: 18px; padding: 14px 16px; }
.board.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.cell span, .board .lbl { font-size: .85rem; font-weight: 600; color: var(--muted); }
.cell b, .score b { font-weight: 800; font-stretch: 125%; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.shoot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 14px; align-items: center; }
.pname { font-weight: 800; font-stretch: 125%; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pname.r { text-align: right; }
.pname.turn { color: var(--accent); }
.pname.turn::before { content: "▶ "; }
.pname.r.turn::before { content: ""; }
.pname.r.turn::after { content: " ◀"; }
.score { display: flex; gap: 6px; align-items: baseline; }
.score b { font-size: 2.4rem; }
.score i { font-style: normal; color: var(--muted); }
.lamps { display: flex; gap: 5px; flex-wrap: wrap; }
.lamps.r { justify-content: flex-end; }
.lamp { width: 16px; height: 16px; border-radius: 50%; background: var(--dim); }
.lamp.ok { background: var(--chalk); box-shadow: inset 0 0 0 4px var(--chalk), inset 0 0 0 8px var(--paper-ink); }
.lamp.no { background: var(--bad); }
.lamp.now { box-shadow: inset 0 0 0 2.5px var(--accent); background: transparent; }
.shoot .mid { grid-column: 2; text-align: center; }
.series { grid-column: 1 / -1; text-align: center; }

.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.progress i { height: 6px; border-radius: 3px; background: var(--dim); }
.progress i.ok { background: var(--good); }
.progress i.no { background: var(--bad); }
.progress i.now { background: var(--accent); }

/* Fråga på ljust kort */
.q { background: var(--paper); color: var(--paper-ink); border-radius: 24px; padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.tags { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 2px; font-size: .9rem; font-weight: 600; color: var(--paper-muted); }
.tags > * + *::before { content: "·"; margin-right: 8px; color: var(--paper-line); }
.tag { font: inherit; color: inherit; border: 0; padding: 0; }
.tag.lvl { color: inherit; }
.shooter { font-weight: 800; color: var(--paper-ink); }
.q h2 { margin: 0; font-weight: 750; font-size: clamp(1.3rem, 5.6vw, 1.55rem); line-height: 1.22; letter-spacing: -.01em; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 340px) { .opts { grid-template-columns: 1fr; } }
.opt {
  display: flex; flex-direction: column; justify-content: space-between; gap: 6px; text-align: left; min-width: 0;
  font: 650 1.05rem/1.2 var(--font); color: var(--paper-ink); overflow-wrap: anywhere;
  background: #fff; border: 2px solid var(--paper-line); border-radius: 14px; box-shadow: 0 3px 0 var(--paper-line);
  padding: 10px 14px 14px; min-height: 80px; margin-bottom: 3px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  transition: border-color .12s, transform .08s, box-shadow .08s;
}
.opt:hover:not(:disabled) { border-color: var(--paper-ink); box-shadow: 0 3px 0 var(--paper-ink); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.opt kbd { font: 800 .8rem var(--font); color: #6A7E71; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--right); background: var(--right-bg); box-shadow: 0 3px 0 var(--right); }
.opt.right kbd { color: var(--right); }
.opt.wrong { border-color: var(--wrong); background: var(--wrong-bg); box-shadow: 0 3px 0 var(--wrong); }
.opt.wrong kbd { color: var(--wrong); }
.opt.dim { opacity: .45; box-shadow: none; }

.fact { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--paper-line); padding-top: 12px; }
.fact strong { font-size: 1rem; font-weight: 700; }
.fact strong.big2 { font-weight: 900; font-stretch: 125%; font-size: 2.2rem; line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }
.fact strong.ok { color: var(--right); }
.fact strong.no { color: var(--wrong); }
.fact p { margin: 0; color: #22362A; line-height: 1.55; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; flex: 1 1 200px;
  min-height: 56px; padding: 0 22px; border: 0; border-radius: 14px; cursor: pointer;
  font: 800 1.1rem/1 var(--font); background: var(--accent); color: var(--paper-ink);
  box-shadow: 0 4px 0 var(--accent-deep); margin-bottom: 4px; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-deep); }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 0; }
.btn.ghost:active { transform: none; }
.q .btn { background: var(--paper-ink); color: var(--chalk); box-shadow: 0 4px 0 #000, 0 0 0 14px var(--paper); position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.q .btn:active { box-shadow: 0 0 0 #000, 0 0 0 14px var(--paper); }
.hint { font-size: .88rem; color: var(--muted); margin: 0; }

/* Startformulär */
.setup { display: flex; flex-direction: column; gap: 18px; }
.setup h2 { margin: 0; font-weight: 800; font-stretch: 125%; font-size: clamp(1.45rem, 6vw, 1.8rem); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.vs .x { font-weight: 800; font-stretch: 125%; font-size: 1.1rem; color: var(--muted); padding-bottom: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .9rem; font-weight: 600; color: var(--muted); }
.field input {
  font: 600 1.1rem var(--font); color: var(--chalk); background: var(--card); width: 100%; min-width: 0;
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px;
}
.field input:focus { outline: none; border-color: var(--accent); }
.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; color: var(--soft); }
.rules li::marker { color: var(--accent); }

/* Filter (träning) */
.filters summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;
  min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-line); font-weight: 800;
}
.filters summary::-webkit-details-marker { display: none; }
.filters summary small { font-weight: 500; font-size: .9rem; color: var(--muted); flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filters summary span { color: var(--accent); }
.filters summary svg { width: 22px; height: 22px; flex: none; }
.filters[open] summary { border-radius: 14px 14px 0 0; }
.filters .panel { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; background: var(--card); border: 1px solid var(--card-line); border-top: 0; border-radius: 0 0 14px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span.lbl { font-size: .85rem; font-weight: 700; color: var(--muted); align-self: center; margin-right: 4px; min-width: 64px; }
.chip { font: 600 .9rem/1 var(--font); color: var(--chalk); background: var(--night); border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
.chip:hover { border-color: var(--soft); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper-ink); }
.chip small { font-size: .8rem; opacity: .7; margin-left: 4px; }

/* Resultat */
.result { display: flex; flex-direction: column; gap: 16px; }
.big { font-weight: 900; font-stretch: 125%; font-size: clamp(4.2rem, 22vw, 6rem); line-height: .85; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.big em { font-style: normal; color: var(--muted); font-size: .4em; }
.winner { margin: 0; font-weight: 900; font-stretch: 125%; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.02; letter-spacing: -.02em; color: var(--accent); text-wrap: balance; }
.verdict { margin: 0; font-weight: 800; font-stretch: 125%; font-size: 1.5rem; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--card-line); }
.review li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--card-line); }
.review li > div { min-width: 0; }
.review .mark { font-weight: 800; }
.review .mark.ok { color: var(--good); }
.review .mark.no { color: var(--bad); }
.review .rq { font-weight: 600; }
.review .ra { font-size: .9rem; color: var(--muted); }
.review .who { font-size: .85rem; font-weight: 700; color: var(--accent); }

footer { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--card-line); padding-top: 12px; }

@media (prefers-reduced-motion: reduce) { .opt, .btn { transition: none; } .opt:active:not(:disabled), .btn:active { transform: none; } }
</style>

const $ = id => document.getElementById(id);
const stage = $("stage");
const LVL = { 1: "Lätt", 2: "Medel", 3: "Svår" };

/* ---------- Hjälpfunktioner ---------- */
function ls(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem("straffpunkten-" + key));
    localStorage.setItem("straffpunkten-" + key, JSON.stringify(val));
  } catch { return null; }
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function qid(q) { let h = 0; for (const ch of q.q) h = (h * 31 + ch.charCodeAt(0)) | 0; return (h >>> 0).toString(36); }
BANK.forEach(q => q.id = qid(q));
function getSeen() { return new Set(ls("seen") || []); }
function markSeen(q) { const s = getSeen(); s.add(q.id); ls("seen", [...s]); }
function prep(q) {
  const order = shuffle([0, 1, 2, 3]);
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}
/* Drar en osedd fråga ur urvalet; börjar om på urvalet när det tagit slut. */
function draw(filter, used) {
  const p = BANK.filter(q => filter(q) && !used.has(q.id));
  if (!p.length) return null;
  const seen = getSeen();
  let fresh = p.filter(q => !seen.has(q.id));
  if (!fresh.length) { p.forEach(q => seen.delete(q.id)); ls("seen", [...seen]); fresh = p; }
  const q = fresh[Math.floor(Math.random() * fresh.length)];
  used.add(q.id);
  return prep(q);
}

function questionHTML(q, tagsExtra) {
  return `
    <section class="q">
      <div class="tags">${tagsExtra || ""}<span class="tag">${esc(q.c)}</span><span class="tag lvl">${LVL[q.d]}</span></div>
      <h2>${esc(q.q)}</h2>
      <div class="opts">
        ${q.o.map((t, i) => `<button class="opt" id="opt${i}" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(t)}</span></button>`).join("")}
      </div>
      <div id="after"></div>
    </section>`;
}
function lockOptions(q, i) {
  stage.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
}

/* ---------- Läge ---------- */
let mode = location.hash === "#traning" ? "train" : location.hash === "#van" ? "shoot" : ls("mode") === "train" ? "train" : "shoot";
let state = { answered: false, onAnswer: null, onNext: null };

/* Kort vibration vid mål, två korta vid räddning. Gör inget på enheter utan vibration (t.ex. iPhone). */
function buzz(ok) { try { navigator.vibrate && navigator.vibrate(ok ? [40, 30, 90] : [25, 60, 25]); } catch (e) {} }

function setMode(m) {
  mode = m; ls("mode", m);
  $("logo").textContent = m === "train" ? "Träning" : "Möt en vän";
  document.title = (m === "train" ? "Träning" : "Möt en vän") + " – Straffpunkten";
  try { history.replaceState(null, "", m === "train" ? "#traning" : "#van"); } catch (e) {}
  $("modeShoot").setAttribute("aria-pressed", m === "shoot");
  $("modeTrain").setAttribute("aria-pressed", m === "train");
  $("filters").hidden = m !== "train";
  $("progress").hidden = m !== "train";
  if (m === "train") { renderFilters(); newTraining(); } else { shootSetup(); }
}
$("modeShoot").addEventListener("click", () => setMode("shoot"));
$("modeTrain").addEventListener("click", () => setMode("train"));
/* Logotypen börjar om läget man står i: ny straffläggning eller ny träningsomgång. */
$("logo").addEventListener("click", e => { e.preventDefault(); $("filters").open = false; setMode(mode); window.scrollTo(0, 0); });

/* ================= STRAFFLÄGGNING ================= */
const KICKS = 5;
let G = null;       // pågående match
let names = ls("names") || ["", ""];

function seriesKey(a, b) { return [a, b].map(s => s.toLowerCase()).sort().join("|"); }
function seriesGet(a, b) { const all = ls("series") || {}; return all[seriesKey(a, b)] || {}; }
function seriesWin(a, b, winner) {
  const all = ls("series") || {}; const k = seriesKey(a, b);
  all[k] = all[k] || {}; all[k][winner.toLowerCase()] = (all[k][winner.toLowerCase()] || 0) + 1;
  ls("series", all);
}

function shootSetup() {
  G = null;
  renderShootBoard();
  $("foot").textContent = `Frågebank: ${BANK.length} frågor. Fakta kontrollerade per oktober 2026. Svara med 1–4, gå vidare med Enter.`;
  stage.innerHTML = `
    <form class="setup" id="setup" novalidate>
      <h2>Två spelare, fem straffar var. Rätt svar är mål.</h2>
      <div class="vs">
        <div class="field"><label for="p1">Spelare 1</label><input id="p1" maxlength="14" autocomplete="off" placeholder="Namn" value="${esc(names[0])}"></div>
        <span class="x">mot</span>
        <div class="field"><label for="p2">Spelare 2</label><input id="p2" maxlength="14" autocomplete="off" placeholder="Namn" value="${esc(names[1])}"></div>
      </div>
      <ul class="rules">
        <li>Ni turas om att skjuta. Varje straff är en fråga.</li>
        <li>I varje omgång får ni frågor av samma svårighetsgrad.</li>
        <li>Matchen avgörs så fort ingen av er kan komma ikapp.</li>
        <li>Lika efter fem? Då blir det sudden death med svåra frågor.</li>
      </ul>
      <div class="actions"><button class="btn" type="submit">Till straffpunkten</button></div>
      <p class="hint">Ingen registrering. Namnen sparas bara i den här webbläsaren.</p>
    </form>`;
  $("setup").addEventListener("submit", e => {
    e.preventDefault();
    const a = $("p1").value.trim() || "Spelare 1";
    let b = $("p2").value.trim() || "Spelare 2";
    if (a.toLowerCase() === b.toLowerCase()) b += " 2";
    names = [a, b]; ls("names", names);
    startMatch(0);
  });
}

/* Svårighet per omgång: samma för båda spelarna. */
function roundLevels() { return shuffle([1, 2, 2, 3, 3]); }

function startMatch(starter) {
  G = { p: names.slice(), starter, kicks: [[], []], used: new Set(), levels: roundLevels(), log: [], over: false, winner: null };
  nextKick();
}

function goals(i) { return G.kicks[i].filter(Boolean).length; }
function shooter() {
  const [a, b] = [G.starter, 1 - G.starter];
  return G.kicks[a].length <= G.kicks[b].length ? a : b;
}
function decided() {
  const g = [goals(0), goals(1)], n = [G.kicks[0].length, G.kicks[1].length];
  if (n[0] <= KICKS && n[1] <= KICKS) {
    const rem = [KICKS - n[0], KICKS - n[1]];
    if (g[0] > g[1] + rem[1]) return 0;
    if (g[1] > g[0] + rem[0]) return 1;
  }
  if (n[0] === n[1] && n[0] >= KICKS && g[0] !== g[1]) return g[0] > g[1] ? 0 : 1;
  return null;
}

function renderShootBoard() {
  const b = $("board");
  b.className = "board";
  if (!G) {
    b.innerHTML = `<div class="shoot">
      <span class="pname">${esc(names[0] || "Spelare 1")}</span>
      <div class="score mid"><b>0</b><i>–</i><b>0</b></div>
      <span class="pname r">${esc(names[1] || "Spelare 2")}</span>
      <div class="lamps">${'<i class="lamp"></i>'.repeat(KICKS)}</div><span></span>
      <div class="lamps r">${'<i class="lamp"></i>'.repeat(KICKS)}</div>
    </div>`;
    return;
  }
  const cur = G.over || decided() !== null ? -1 : shooter();
  const lamps = i => {
    const total = Math.max(KICKS, G.kicks[0].length, G.kicks[1].length);
    return Array.from({ length: total }, (_, k) => {
      const v = G.kicks[i][k];
      const now = !G.over && i === cur && k === G.kicks[i].length;
      return `<i class="lamp ${v === true ? "ok" : v === false ? "no" : ""} ${now ? "now" : ""}"></i>`;
    }).join("");
  };
  const ser = seriesGet(G.p[0], G.p[1]);
  const s0 = ser[G.p[0].toLowerCase()] || 0, s1 = ser[G.p[1].toLowerCase()] || 0;
  b.innerHTML = `<div class="shoot">
    <span class="pname ${cur === 0 ? "turn" : ""}">${esc(G.p[0])}</span>
    <div class="score mid"><b>${goals(0)}</b><i>–</i><b>${goals(1)}</b></div>
    <span class="pname r ${cur === 1 ? "turn" : ""}">${esc(G.p[1])}</span>
    <div class="lamps">${lamps(0)}</div><span></span>
    <div class="lamps r">${lamps(1)}</div>
    ${s0 + s1 ? `<span class="lbl series">Matchserie ${s0}–${s1}</span>` : ""}
  </div>`;
}

function nextKick() {
  const w = decided();
  if (w !== null) return endMatch(w);
  const s = shooter();
  const k = G.kicks[s].length;
  const sudden = k >= KICKS;
  // Båda spelarnas straff nr k får samma nivå. I sudden death: svårt, annars medel.
  let level = sudden ? 3 : G.levels[k];
  let q = draw(x => x.d === level, G.used) || draw(() => true, G.used);
  if (!q) { G.used.clear(); q = draw(() => true, G.used); }
  G.q = q;
  state.answered = false;
  renderShootBoard();
  const label = sudden ? `<span class="tag" style="color:var(--bad)">Sudden death</span>` : `<span class="tag lvl">Straff ${k + 1} av ${KICKS}</span>`;
  stage.innerHTML = questionHTML(q, `<span class="shooter">${esc(G.p[s])} skjuter</span>${label}`);
  stage.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => answer(+btn.dataset.i)));
  state.onAnswer = i => {
    const ok = i === q.a;
    buzz(ok);
    G.kicks[s].push(ok);
    G.log.push({ who: s, q, ok });
    markSeen(q);
    lockOptions(q, i);
    renderShootBoard();
    const w2 = decided();
    const nextName = w2 === null ? G.p[shooter()] : null;
    $("after").innerHTML = `
      <div class="fact">
        <strong class="big2 ${ok ? "ok" : "no"}">${ok ? "Mål!" : "Räddad!"}</strong>
        ${ok ? "" : `<strong class="no">Rätt svar: ${esc(q.o[q.a])}</strong>`}
        <p>${esc(q.f)}</p>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="next">${w2 !== null ? "Se slutresultat" : `Nästa straff: ${esc(nextName)}`}</button>
      </div>`;
    $("next").addEventListener("click", next);
    $("next").focus();
  };
  state.onNext = nextKick;
}

function endMatch(w) {
  G.over = true; G.winner = w;
  state.answered = false; state.onNext = null;
  seriesWin(G.p[0], G.p[1], G.p[w]);
  renderShootBoard();
  const sudden = G.kicks[0].length > KICKS;
  const ser = seriesGet(G.p[0], G.p[1]);
  const s0 = ser[G.p[0].toLowerCase()] || 0, s1 = ser[G.p[1].toLowerCase()] || 0;
  stage.innerHTML = `
    <section class="result">
      <p class="winner">${esc(G.p[w])} vinner ${goals(w)}–${goals(1 - w)}</p>
      <p class="hint">${sudden ? "Avgjort i sudden death." : "Avgjort i ordinarie straffläggning."} Matchserie: ${esc(G.p[0])} ${s0}–${s1} ${esc(G.p[1])}.</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" id="again">Spela igen</button>
        <button class="btn ghost" id="newp">Nya spelare</button>
      </div>
      <ul class="review">
        ${G.log.map(e => `
          <li><span class="mark ${e.ok ? "ok" : "no"}">${e.ok ? "✓" : "✗"}</span>
          <div><div class="who">${esc(G.p[e.who])}</div><div class="rq">${esc(e.q.q)}</div><div class="ra">${esc(e.q.o[e.q.a])}</div></div></li>`).join("")}
      </ul>
    </section>`;
  // Vid omspel börjar den andra spelaren skjuta.
  const nextStarter = 1 - G.starter;
  $("again").addEventListener("click", () => { names = G.p.slice(); startMatch(nextStarter); });
  $("newp").addEventListener("click", shootSetup);
  $("again").focus();
}

/* ================= TRÄNING ================= */
const N = 10;
const VERDICTS = [
  [10, "Fullpott. Du kan döma matchen själv."],
  [8,  "Landslagsklass."],
  [6,  "Stabil allsvensk nivå."],
  [4,  "Div 2 med potential."],
  [0,  "Värm upp och försök igen."],
];
const CATS = ["Alla", ...[...new Set(BANK.map(q => q.c))]];
let cat = "Alla", lvl = 0, T = null;

function inPool(q) { return (cat === "Alla" || q.c === cat) && (!lvl || q.d === lvl); }

function renderFilters() {
  const count = c => BANK.filter(q => (c === "Alla" || q.c === c) && (!lvl || q.d === lvl)).length;
  $("cats").innerHTML = `<span class="lbl">Kategori</span>` + CATS.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}<small>${count(c)}</small></button>`).join("");
  $("lvls").innerHTML = `<span class="lbl">Nivå</span>` + [[0, "Alla"], [1, "Lätt"], [2, "Medel"], [3, "Svår"]].map(([v, t]) =>
    `<button class="chip" data-l="${v}" aria-pressed="${v === lvl}">${t}</button>`).join("");
  $("filterLabel").textContent = (cat === "Alla" ? "Alla kategorier" : cat) + " · " + ["Alla nivåer", "Lätt", "Medel", "Svår"][lvl];
  const close = () => { $("filters").open = false; };
  $("cats").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { cat = b.dataset.c; renderFilters(); newTraining(); close(); }));
  $("lvls").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    lvl = +b.dataset.l;
    if (count(cat) < 4) cat = "Alla";
    renderFilters(); newTraining(); close();
  }));
}

function newTraining() {
  const used = new Set(), round = [];
  for (let i = 0; i < N; i++) { const q = draw(inPool, used); if (!q) break; round.push(q); }
  T = { round, idx: 0, score: 0, streak: 0, answers: [] };
  const p = BANK.filter(inPool), seen = getSeen();
  $("foot").textContent = `Frågebank: ${BANK.length} frågor, ${p.length} i ditt urval, varav ${p.filter(q => !seen.has(q.id)).length} du inte sett. Fakta kontrollerade per oktober 2026. Svara med 1–4, gå vidare med Enter.`;
  trainQuestion();
}

function renderTrainBoard(done) {
  const n = T.round.length;
  const b = $("board");
  b.className = "board tri";
  b.innerHTML = `
    <div class="cell"><span>Fråga</span><b>${done ? "SLUT" : `${Math.min(T.idx + 1, n)}/${n}`}</b></div>
    <div class="cell"><span>Mål</span><b>${T.score}</b></div>
    <div class="cell"><span>Svit</span><b>${T.streak}</b></div>`;
  $("progress").style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  $("progress").innerHTML = Array.from({ length: n }, (_, i) =>
    `<i class="${i < T.answers.length ? (T.answers[i] ? "ok" : "no") : i === T.idx && !done ? "now" : ""}"></i>`).join("");
}

function trainQuestion() {
  const q = T.round[T.idx];
  state.answered = false;
  renderTrainBoard();
  stage.innerHTML = questionHTML(q);
  stage.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => answer(+btn.dataset.i)));
  state.onAnswer = i => {
    const ok = i === q.a;
    buzz(ok);
    T.answers.push(ok);
    if (ok) { T.score++; T.streak++; } else T.streak = 0;
    markSeen(q);
    lockOptions(q, i);
    const last = T.idx === T.round.length - 1;
    $("after").innerHTML = `
      <div class="fact">
        <strong class="${ok ? "ok" : "no"}">${ok ? "Mål!" : `Räddning. Rätt svar: ${esc(q.o[q.a])}`}</strong>
        <p>${esc(q.f)}</p>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn" id="next">${last ? "Se resultat" : "Nästa fråga"}</button>
      </div>`;
    $("next").addEventListener("click", next);
    $("next").focus();
    renderTrainBoard();
  };
  state.onNext = () => { T.idx++; if (T.idx < T.round.length) trainQuestion(); else trainResult(); };
}

function trainResult() {
  state.answered = false; state.onNext = null;
  renderTrainBoard(true);
  const n = T.round.length;
  const full = n === N && cat === "Alla" && !lvl;
  const prev = ls("best");
  const record = full && (prev === null || T.score > prev);
  if (record) ls("best", T.score);
  const best = ls("best");
  const verdict = VERDICTS.find(([min]) => T.score * N / n >= min)[1];
  stage.innerHTML = `
    <section class="result">
      <div class="big">${T.score}<em>/${n}</em></div>
      <p class="verdict">${verdict}</p>
      <p class="hint">${record && prev !== null ? "Nytt personligt rekord. " : ""}${best !== null ? `Ditt rekord i blandat: ${best}/${N}.` : ""}</p>
      <ul class="review">
        ${T.round.map((q, i) => `
          <li><span class="mark ${T.answers[i] ? "ok" : "no"}">${T.answers[i] ? "✓" : "✗"}</span>
          <div><div class="rq">${esc(q.q)}</div><div class="ra">${esc(q.o[q.a])}</div></div></li>`).join("")}
      </ul>
      <div class="actions"><button class="btn" id="again">Ny omgång</button></div>
    </section>`;
  $("again").addEventListener("click", newTraining);
  $("again").focus();
}

/* ---------- Gemensamt ---------- */
function answer(i) {
  if (state.answered || !state.onAnswer) return;
  state.answered = true;
  state.onAnswer(i);
}
function next() {
  if (!state.answered || !state.onNext) return;
  state.onNext();
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches && e.target.matches("input, textarea")) return;
  if (!state.answered && state.onAnswer && document.querySelector(".opt") && /^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if (e.key === "Enter" && state.answered && document.activeElement?.id !== "next") { e.preventDefault(); next(); }
});

setMode(mode);
</script>
